<div >
    <input [(ngModel)]="binding"  (keyup.enter)="onInputChange()" (input)="onInputChange()"  type="text" name="" placeholder="Search" class=" w-full placeholder:text-black/[0.5] bg-gray-400/[0.1] active:bg-white box-border hover:shadow-xl rounded-lg h-12 pl-4 transition-shadow my-3">
    <hr class="text-black/[0.8] my-0 mb-4">
</div>

@if (articles.length == 0) {
    <div class="min-h-screen flex items-center justify-center">
        <h2 class="text-black/[0.1] text-5xl">No Articles Found!</h2>
    </div>
}

@if (articles.length >0) {
    <div [routerLink]="['/article',articles[0].id]" class="flex flex-col hover:text-gray-800/[0.8] text-black/[0.8] cursor-pointer w-full mb-10">
        <div class="overflow-hidden relative aspect-video bg-gradient-to-tr from-indigo-500 to-indigo-900 rounded-2xl mb-2 shadow-sm hover:saturate-[1.18] transition-all">
            <img [src]="articles[0].image" class="absolute w-full h-full object-cover" alt="" style="color: #00000031;">
            <div class="absolute right-0 shadow-[0px_0px_0px_11px] shadow-white text-white text-[10px] flex flex-col items-center px-4 py-2 rounded-full bg-gray-400/[0.6]">
                <div class="absolute h-12 w-12 rounded-full -bottom-[58px] right-0 shadow-[15px_-15px_0px_-5px] shadow-white bg-transparent"></div>
                <div class="absolute h-12 w-12 rounded-full -left-[58px] top-0 shadow-[15px_-20px_0px_-6px] shadow-white bg-transparent"></div>
                {{articles[0].category| uppercase}}
            </div>
